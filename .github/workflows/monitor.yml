
name: API Availability Monitor

on:
  schedule:
    - cron: '0 * * * *'
  workflow_dispatch:

jobs:
  monitor-api:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install Newman
        run: npm install -g newman

      - name: Check Monitor Collection
        run: test -f Monitor_Collection.json

      - name: Run Monitor
        env:
          REQRES_API_KEY: ${{ secrets.REQRES_API_KEY }}
        run: |
          newman run Monitor_Collection.json \
            --env-var "apiKey=$REQRES_API_KEY" \
            --reporters cli
